<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac Cleaner — native macOS disk cleaner</title>
<meta name="description" content="Native macOS disk cleaner built with SwiftUI. Disk map, duplicates, large files, system junk. No telemetry, no subscriptions.">
<style>
  :root {
    --bg: #0d0d12;
    --card: #17171f;
    --stroke: #2a2a36;
    --text: #f2f2f5;
    --muted: #9a9aa8;
    --accent: #7c3aed;
    --accent2: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

  /* Hero */
  .hero { text-align: center; padding: 88px 24px 56px; position: relative; overflow: hidden; }
  .hero::before {
    content: "";
    position: absolute; inset: -200px -100px auto;
    height: 480px;
    background: radial-gradient(closest-side, rgba(124,58,237,.28), transparent);
    pointer-events: none;
  }
  .hero img.icon { width: 128px; height: 128px; border-radius: 28px;
    box-shadow: 0 18px 50px rgba(124,58,237,.35); position: relative; }
  .hero h1 { font-size: 44px; letter-spacing: -0.02em; margin-top: 22px; position: relative; }
  .hero p.tag { color: var(--muted); font-size: 19px; max-width: 560px; margin: 12px auto 0; position: relative; }
  .cta { margin-top: 30px; display: flex; gap: 14px; justify-content: center; position: relative; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 13px 26px; border-radius: 13px;
    font-weight: 600; font-size: 16px; text-decoration: none; transition: transform .12s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { color: #fff; background: linear-gradient(135deg, var(--accent2), var(--accent)); }
  .btn-ghost { color: var(--text); background: var(--card); border: 1px solid var(--stroke); }

  /* Screenshots */
  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 48px 0 8px; }
  .shots img { width: 100%; border-radius: 14px; border: 1px solid var(--stroke); display: block; }
  @media (max-width: 720px) { .shots { grid-template-columns: 1fr; } }

  /* Features */
  h2 { font-size: 28px; letter-spacing: -0.01em; margin: 56px 0 20px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .feat { background: var(--card); border: 1px solid var(--stroke); border-radius: 14px; padding: 18px 20px; }
  .feat .t { font-weight: 650; margin-bottom: 4px; }
  .feat .d { color: var(--muted); font-size: 14.5px; }
  .feat .ic { font-size: 20px; margin-bottom: 10px; display: block; }

  footer { color: var(--muted); text-align: center; font-size: 14px; padding: 48px 0 40px; }
  footer a { color: var(--accent2); text-decoration: none; }
  .lang { position: absolute; top: 18px; right: 22px; z-index: 2; }
  .lang button {
    background: var(--card); color: var(--muted); border: 1px solid var(--stroke);
    padding: 6px 12px; border-radius: 9px; cursor: pointer; font-size: 13px; margin-left: 6px;
  }
  .lang button.on { color: #fff; border-color: var(--accent); }
</style>
</head>
<body>

<div class="lang">
  <button id="btn-en" onclick="setLang('en')">EN</button>
  <button id="btn-ru" onclick="setLang('ru')">RU</button>
</div>

<section class="hero">
  <img class="icon" src="icon.png" alt="Mac Cleaner icon">
  <h1>Mac Cleaner</h1>
  <p class="tag" data-en="A native macOS disk cleaner. No telemetry, no subscriptions — just facts and control."
     data-ru="Нативный очиститель диска для macOS. Без телеметрии и подписок — только факты и контроль."></p>
  <div class="cta">
    <a class="btn btn-primary" href="https://github.com/MrPacmann/MacCleaner/releases/latest"
       data-en="Download for macOS" data-ru="Скачать для macOS"></a>
    <a class="btn btn-ghost" href="https://github.com/MrPacmann/MacCleaner"
       data-en="GitHub" data-ru="GitHub"></a>
  </div>
</section>

<div class="wrap">
  <div class="shots">
    <img src="screenshots/01-overview.png" alt="Disk overview — dark theme">
    <img src="screenshots/14-overview-light.png" alt="Disk overview — light theme">
    <img src="screenshots/04-map.png" alt="Interactive disk map">
    <img src="screenshots/08-junk.png" alt="System junk categories">
  </div>

  <h2 data-en="Everything you need to reclaim space" data-ru="Всё, чтобы вернуть себе место"></h2>
  <div class="grid">
    <div class="feat"><span class="ic">🥧</span><div class="t" data-en="Disk Overview" data-ru="Обзор диска"></div>
      <div class="d" data-en="Space by category, with drill-down into every file." data-ru="Место по категориям с проваливанием в файлы."></div></div>
    <div class="feat"><span class="ic">🗺️</span><div class="t" data-en="Disk Map" data-ru="Карта диска"></div>
      <div class="d" data-en="Interactive folder treemap, DaisyDisk-style." data-ru="Интерактивная treemap папок, как в DaisyDisk."></div></div>
    <div class="feat"><span class="ic">🔍</span><div class="t" data-en="Large Files & Duplicates" data-ru="Большие файлы и дубликаты"></div>
      <div class="d" data-en="50 MB+ files, heavy folders, exact SHA-256 duplicates." data-ru="Файлы от 50 МБ, тяжёлые папки, точные дубликаты по SHA-256."></div></div>
    <div class="feat"><span class="ic">🧹</span><div class="t" data-en="System Junk" data-ru="Системный мусор"></div>
      <div class="d" data-en="Caches, logs, Xcode, Docker, node_modules, iOS backups, Mail attachments." data-ru="Кэши, логи, Xcode, Docker, node_modules, бэкапы iPhone, вложения почты."></div></div>
    <div class="feat"><span class="ic">📈</span><div class="t" data-en="History & Analytics" data-ru="История и аналитика"></div>
      <div class="d" data-en="Free-space chart and what grew since the last scan." data-ru="График свободного места и что выросло с прошлого сканирования."></div></div>
    <div class="feat"><span class="ic">🛡️</span><div class="t" data-en="Safe by Design" data-ru="Безопасность по умолчанию"></div>
      <div class="d" data-en="Everything goes to Trash first. Nothing touches system files." data-ru="Удаление только в Корзину. Системные файлы не трогаем."></div></div>
    <div class="feat"><span class="ic">🔄</span><div class="t" data-en="Auto-updates" data-ru="Автообновления"></div>
      <div class="d" data-en="New versions download and install themselves from GitHub." data-ru="Новые версии скачиваются и ставятся сами с GitHub."></div></div>
    <div class="feat"><span class="ic">⌨️</span><div class="t" data-en="Hotkeys & Shortcuts" data-ru="Хоткеи и Shortcuts"></div>
      <div class="d" data-en="⌘1…⌘0 between sections, ⌘F to search, Siri & Shortcuts actions." data-ru="⌘1…⌘0 по разделам, ⌘F — поиск, действия для Siri и Shortcuts."></div></div>
    <div class="feat"><span class="ic">🌗</span><div class="t" data-en="Two Languages, Two Themes" data-ru="Два языка, две темы"></div>
      <div class="d" data-en="English & Russian UI, dark and light themes, menu bar stats." data-ru="Русский и английский, тёмная и светлая темы, статистика в меню-баре."></div></div>
  </div>

  <footer>
    <span data-en="Built by" data-ru="Автор"></span> <a href="https://github.com/MrPacmann">Stepan Trushin</a> ·
    <a href="https://github.com/MrPacmann/MacCleaner/blob/main/LICENSE">MIT License</a> ·
    <span data-en="macOS 14+" data-ru="macOS 14+"></span>
  </footer>
</div>

<script>
function setLang(lang) {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.dataset[lang];
  });
  document.getElementById('btn-en').classList.toggle('on', lang === 'en');
  document.getElementById('btn-ru').classList.toggle('on', lang === 'ru');
  localStorage.setItem('mc-lang', lang);
}
const saved = localStorage.getItem('mc-lang');
setLang(saved || ((navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en'));
</script>
</body>
</html>
